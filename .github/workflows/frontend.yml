name: Deploy Frontend to EC2

on:
  workflow_run:
    workflows: ["Deploy Backend to EC2"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            APP_DIR=/home/ec2-user/front
            REPO=https://github.com/CloudTechDevOps/Java-springboot-project.git
            LOG_DIR=/home/ec2-user/logs

            mkdir -p $APP_DIR $LOG_DIR
            cd $APP_DIR

            # Clone or pull
            if [ -d "repo/.git" ]; then
              cd repo
              git reset --hard
              git pull origin main
            else
              git clone $REPO repo
              cd repo
            fi

            cd frontend

            # Setup venv
            python3 -m venv venv || true
            source venv/bin/activate

            pip install --upgrade pip
            pip install -r requirements.txt

            # Create systemd service
            sudo tee /etc/systemd/system/frontend.service > /dev/null <<EOF
            [Unit]
            Description=Streamlit Frontend
            After=network.target

            [Service]
            User=ec2-user
            WorkingDirectory=$APP_DIR/repo/frontend

            ExecStart=$APP_DIR/repo/frontend/venv/bin/python -m streamlit run app.py --server.port=8501 --server.address=0.0.0.0

            Restart=always
            RestartSec=5

            StandardOutput=append:$LOG_DIR/frontend.log
            StandardError=append:$LOG_DIR/frontend-error.log

            [Install]
            WantedBy=multi-user.target
            EOF

            # Restart service
            sudo systemctl daemon-reload
            sudo systemctl enable frontend
            sudo systemctl restart frontend

            sleep 10

            sudo systemctl status frontend --no-pager

            sudo systemctl status frontend --no-pager

            echo "✅ Frontend deployment successful"
